# SearXNG Configuration for cmdesk
# Merged over the image defaults; mounted at /etc/searxng/settings.yml
use_default_settings: true

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "${SEARX_SECRET_KEY:-change_this_secret_key}"
  base_url: "${SEARXNG_BASE_URL:-http://localhost:8888/}"
  image_proxy: true

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  max_result_count: 20
  formats:
    - html
    - json

ui:
  static_use_hash: false
  default_locale: "en"
  theme: simple
  infinite_scroll: false
  search_on_category_select: true
  hotkeys: vim

outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0
  user_agent_suffix: "cmdesk-agent"
  enable_http2: true
  pool_connections: 100
  pool_maxsize: 20

limiter: false
